  padding:6px calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 10px) calc(env(safe-area-inset-left) + 12px)}
.pw{pointer-events:auto;position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;border-radius:24px;
  padding:8px 18px 8px 10px;height:clamp(72px,10vmin,100px);min-width:clamp(180px,26vmin,280px);font-weight:900;
  font-size:clamp(17px,2.6vmin,26px);box-shadow:0 5px 0 rgba(0,0,0,.35);text-align:left}
.pw img{height:85%;width:auto;pointer-events:none}
.pw small{display:block;font-size:.65em;opacity:.85;font-weight:700}
#pwDad{background:linear-gradient(#58a6ff,#2f6fd6)}
#pwEden{background:linear-gradient(#ffd84d,#f0a400);color:#4a2c00}
.pw.ready{animation:glow 1.2s infinite}
@keyframes glow{50%{box-shadow:0 5px 0 rgba(0,0,0,.35),0 0 22px 6px rgba(255,255,255,.7)}}
.pw:active{transform:translateY(3px)}
.pw .cd{position:absolute;inset:0;pointer-events:none}
.pw .cdt{position:absolute;right:12px;top:6px;font-size:.8em;pointer-events:none}
.screen{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  background:rgba(30,20,70,.82);padding:calc(env(safe-area-inset-top) + 16px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 16px) calc(env(safe-area-inset-left) + 16px);overflow:hidden}
.screen.show{display:flex}
#start{background:radial-gradient(circle at 50% 30%,#6b5cff,#2b2350 75%)}
h1{margin:0 0 6px;font-size:clamp(40px,9vmin,96px);font-weight:900;color:#b6ff5c;text-shadow:0 5px 0 #3a7a00,0 10px 20px rgba(0,0,0,.4);letter-spacing:2px}
h2{margin:0 0 10px;font-size:clamp(32px,7vmin,72px);font-weight:900}
.cast{display:flex;align-items:flex-end;justify-content:center;gap:3vmin;margin:6px 0 10px}
.cast img{height:clamp(70px,15vmin,170px);filter:drop-shadow(0 6px 6px rgba(0,0,0,.35))}
.cast .vs{font-size:clamp(28px,6vmin,60px);font-weight:900;color:#ffd84d;align-self:center}
#monStart{animation:wob 1s ease-in-out infinite}
@keyframes wob{50%{transform:scale(1.08) rotate(-4deg)}}
.rules{background:rgba(0,0,0,.25);border-radius:20px;padding:12px 22px;margin:4px 0 16px;font-size:clamp(15px,2.5vmin,24px);line-height:1.55;text-align:left;max-width:760px;font-weight:700}
.big{font-size:clamp(26px,5vmin,48px);font-weight:900;padding:.45em 1.4em;border-radius:999px;background:linear-gradient(#9dff5c,#3fbf1f);color:#173d00;box-shadow:0 7px 0 #1f6a00;margin:8px}
.big:active{transform:translateY(5px);box-shadow:0 2px 0 #1f6a00}
.big.alt{background:linear-gradient(#fff,#cfd3ff);color:#2b2350;box-shadow:0 7px 0 #6f74b8}
.best{font-size:clamp(15px,2.4vmin,22px);opacity:.85;margin-top:6px}
.stat{font-size:clamp(20px,4vmin,40px);font-weight:800;margin:4px 0}
#chance{position:absolute;inset:0;z-index:15;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(80,0,40,.25)}
#chance.show{display:flex}
#chanceBtn{width:clamp(220px,46vmin,440px);height:clamp(220px,46vmin,440px);border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#d4ff7a,#5cc31e 60%,#2f7a00);color:#173d00;font-weight:900;
  font-size:clamp(30px,6.4vmin,62px);line-height:1.1;box-shadow:0 10px 0 #1f5200,0 0 0 10px rgba(255,255,255,.5);animation:pulse .3s infinite alternate}
#chanceBtn span{font-size:1.5em;display:block}
@keyframes pulse{to{transform:scale(1.07)}}
#chanceBar{width:clamp(220px,46vmin,440px);height:18px;border-radius:9px;background:rgba(0,0,0,.4);margin-top:22px;overflow:hidden}
#chanceFill{height:100%;width:100%;background:linear-gradient(90deg,#ff4d6d,#ffd84d)}
#chanceTxt{font-size:clamp(20px,4vmin,40px);font-weight:900;margin-bottom:14px;text-shadow:0 3px 0 rgba(0,0,0,.4)}
#toast{position:absolute;left:0;right:0;top:40%;z-index:12;text-align:center;pointer-events:none;font-weight:900;
  font-size:clamp(34px,8vmin,84px);text-shadow:0 5px 0 rgba(0,0,0,.45),0 0 18px rgba(0,0,0,.4);opacity:0;transform:translateY(-50%) scale(.6);transition:opacity .2s,transform .25s}
#toast.show{opacity:1;transform:translateY(-50%) scale(1)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="hearts" class="pill"></div>
  <div class="pill" id="scoreP">점수 0</div>
  <div class="pill" id="timeP">⏱ 0초</div>
  <div class="pill" id="starP">⭐ 0</div>
  <div class="sp"></div>
  <button class="ib" id="muteBtn" aria-label="소리">🔊</button>
  <button class="ib" id="pauseBtn" aria-label="일시정지">⏸</button>
</div>
<div id="powers">
  <button class="pw" id="pwDad"><img id="pwDadImg" alt=""><div>파워 방구<small>아빠 · 괴물 밀어내기</small></div><div class="cd"></div><span class="cdt"></span></button>
  <button class="pw" id="pwEden"><img id="pwEdenImg" alt=""><div>무적 별<small>이든 · 무적 + 빨라져요</small></div><div class="cd"></div><span class="cdt"></span></button>
</div>
<div id="toast"></div>
<div id="chance">
  <div id="chanceTxt">잡혔다! 빨리 눌러요!</div>
  <button id="chanceBtn"><span>💨</span>방구<br>필살기!</button>
  <div id="chanceBar"><div id="chanceFill"></div></div>
</div>
<div class="screen show" id="start">
  <h1>방구괴물 피하기</h1>
  <div class="cast"><img id="stDad" alt="아빠"><img id="stEden" alt="이든"><div class="vs">VS</div><img id="monStart" alt="방구괴물"></div>
  <div class="rules">
    👆 손가락으로 <b>아빠</b>와 <b>이든</b>이를 끌어서 도망가요! (두 손가락으로 둘 다 움직여요)<br>
    💨 잡히면 <b>“방구 필살기!”</b> 버튼을 빨리 눌러요!<br>
    🪢 끈끈이·밧줄 함정을 밟으면 묶여서 처음부터 다시 해요!<br>
    ⭐ 별을 모으면 점수가 쑥쑥! 하트 3개가 다 없어지면 끝!
  </div>
  <button class="big" id="startBtn">시작하기!</button>
  <div class="best" id="bestStart"></div>
</div>
<div class="screen" id="pause">
  <h2>잠깐 쉬는 중 😴</h2>
  <button class="big" id="resumeBtn">계속하기</button>
  <button class="big alt" id="restartBtn">처음부터</button>
</div>
<div class="screen" id="over">
  <h2>게임 끝! 💨</h2>
  <div class="stat" id="ovScore"></div>
  <div class="stat" id="ovTime"></div>
  <div class="best" id="ovBest"></div>
  <button class="big" id="againBtn">다시 하기</button>
  <button class="big alt" id="homeBtn">처음 화면</button>
</div>

var BASE=[

'#.......#.#.......#',
'#.###.#.....#.###.#',

'###################'];
var BW=BASE[0].length,BH=BASE.length;
var portrait=false,GW=BW,GH=BH,grid=[];
function buildGrid(){
  grid=[];GW=portrait?BH:BW;GH=portrait?BW:BH;
  for(var y=0;y<GH;y++){var row=[];for(var x=0;x<GW;x++){var ch=portrait?BASE[x][y]:BASE[y][x];row.push(ch==='#'?1:0);}grid.push(row);}
}
function P(c,r){return portrait?{x:r+.5,y:c+.5}:{x:c+.5,y:r+.5};}
var START={dad:[7,11],eden:[11,11]},SPAWN=[[9,1],[9,6]];
function isWall(cx,cy){if(cx<0||cy<0||cx>=GW||cy>=GH)return true;return grid[cy][cx]===1;}

// ---------- Helpers ----------
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rnd(a,b){return a+Math.random()*(b-a);}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function bfs(sx,sy){
  var d=new Int16Array(GW*GH).fill(-1);if(isWall(sx,sy))return d;
  var q=[sx+sy*GW];d[q[0]]=0;
  for(var i=0;i<q.length;i++){var p=q[i],x=p%GW,y=(p/GW)|0;
    var nb=[[1,0],[-1,0],[0,1],[0,-1]];
    for(var j=0;j<4;j++){var nx=x+nb[j][0],ny=y+nb[j][1];if(!isWall(nx,ny)&&d[nx+ny*GW]<0){d[nx+ny*GW]=d[p]+1;q.push(nx+ny*GW);}}}
  return d;
}
function freeTiles(){var a=[];for(var y=0;y<GH;y++)for(var x=0;x<GW;x++)if(!grid[y][x])a.push({x:x,y:y});return a;}

var AC=null,master=null,muted=false;
try{muted=localStorage.getItem('fm_muted')==='1';}catch(e){}
function initAudio(){
  if(!AC){try{var C=window.AudioContext||window.webkitAudioContext;if(C){AC=new C();master=AC.createGain();master.gain.value=muted?0:0.8;master.connect(AC.destination);}}catch(e){AC=null;}}
  if(AC&&AC.state==='suspended'){try{AC.resume();}catch(e){}}
}
function noiseBuf(){if(noiseBuf.b)return noiseBuf.b;var n=AC.sampleRate*1.5,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(var i=0;i<n;i++)d[i]=Math.random()*2-1;noiseBuf.b=b;return b;}
function fart(dur,base,vol){
  if(!AC||muted)return;dur=dur||0.6;base=base||90;vol=vol||0.5;
  var t=AC.currentTime+0.01;
  var o=AC.createOscillator();o.type='sawtooth';
  o.frequency.setValueAtTime(base*rnd(1.2,1.5),t);o.frequency.exponentialRampToValueAtTime(base*rnd(.5,.7),t+dur);
  var l=AC.createOscillator();l.type='square';l.frequency.value=rnd(14,28);var lg=AC.createGain();lg.gain.value=base*.4;l.connect(lg);lg.connect(o.frequency);
  var f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=rnd(450,800);f.Q.value=5;
  var g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.03);g.gain.setValueAtTime(vol,t+dur*.55);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(f);f.connect(g);g.connect(master);
  var ns=AC.createBufferSource();ns.buffer=noiseBuf();var nf=AC.createBiquadFilter();nf.type='bandpass';nf.frequency.value=rnd(200,400);nf.Q.value=1.2;
  var ng=AC.createGain();ng.gain.setValueAtTime(0.0001,t);ng.gain.exponentialRampToValueAtTime(vol*.6,t+0.02);ng.gain.exponentialRampToValueAtTime(0.0001,t+dur*.9);
  ns.connect(nf);nf.connect(ng);ng.connect(master);
  o.start(t);l.start(t);ns.start(t);o.stop(t+dur+.05);l.stop(t+dur+.05);ns.stop(t+dur+.05);
}
function tone(freq,dur,type,vol,to,delay){
  if(!AC||muted)return;var t=AC.currentTime+0.01+(delay||0);
  var o=AC.createOscillator();o.type=type||'sine';o.frequency.setValueAtTime(freq,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);
  var g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.25,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05);
}

function makeChar(id){
  var s=P(START[id][0],START[id][1]);
  return {id:id,name:id==='dad'?'아빠':'이든',x:s.x,y:s.y,r:.33,vx:0,vy:0,ptr:null,cd:0,cdMax:id==='dad'?8:12,star:0,safe:0,tied:false,color:id==='dad'?'#3b8cff':'#ffc400',bob:0};
}
function makeMonster(i){
  var s=P(SPAWN[i][0],SPAWN[i][1]);
  return {x:s.x,y:s.y,nx:null,ny:null,lx:-1,ly:-1,stun:1.6,fly:null,ph:Math.random()*6,trail:0,home:i};
}
function placeTraps(){
  traps=[];var ft=freeTiles(),avoid=[P(START.dad[0],START.dad[1]),P(START.eden[0],START.eden[1]),P(SPAWN[0][0],SPAWN[0][1]),P(SPAWN[1][0],SPAWN[1][1])];
  ft=ft.filter(function(t){var c={x:t.x+.5,y:t.y+.5};return avoid.every(function(a){return Math.abs(a.x-c.x)+Math.abs(a.y-c.y)>=3.5;});});
  for(var i=0;i<4&&ft.length;i++){
    var idx=(Math.random()*ft.length)|0,t=ft[idx];
    traps.push({x:t.x+.5,y:t.y+.5,type:i%2?'rope':'gum',ph:Math.random()*6});
    ft=ft.filter(function(o){return Math.abs(o.x-t.x)+Math.abs(o.y-t.y)>=4;});
  }
}
function spawnStar(awayFrom){
  var ft=freeTiles().filter(function(t){
    var c={x:t.x+.5,y:t.y+.5};
    if(traps.some(function(q){return dist(q,c)<.9;}))return false;
    if(stars.some(function(q){return dist(q,c)<.9;}))return false;
    if(chars.some(function(q){return dist(q,c)<2;}))return false;
    if(awayFrom&&dist(awayFrom,c)<4)return false;return true;});
  if(!ft.length)return;var t=ft[(Math.random()*ft.length)|0];
  stars.push({x:t.x+.5,y:t.y+.5,ph:Math.random()*6,pop:0});
}
function releaseAll(){chars.forEach(function(c){c.ptr=null;});}
function resetRound(){
  chars=[makeChar('dad'),makeChar('eden')];
  monsters=[makeMonster(0)];roundTime=0;secondAnnounced=false;
  placeTraps();stars=[];for(var i=0;i<6;i++)spawnStar();
  chance=null;state='play';hideChance();
  toast('도망쳐! 🏃',1100,'#b6ff5c');
}
function newGame(){
  lives=3;score=0;bonus=0;playTime=0;starCount=0;parts=[];
  resetRound();SFX.start();
  show('start',false);show('over',false);show('pause',false);
}

var toastTimer=0;

var lastHud='';

  var s=Math.floor(score);var str=h+'|'+s+'|'+Math.floor(playTime)+'|'+starCount;
  if(str!==lastHud){lastHud=str;$('hearts').innerHTML=h;$('scoreP').textContent='점수 '+s;$('timeP').textContent='⏱ '+Math.floor(playTime)+'초';$('starP').textContent='⭐ '+starCount;}
  [['pwDad',chars[0]],['pwEden',chars[1]]].forEach(function(p){
    var el=$(p[0]),c=p[1];if(!c)return;var cdEl=el.querySelector('.cd'),tx=el.querySelector('.cdt');
    var ready=c.cd<=0&&state==='play';
    el.classList.toggle('ready',ready);
    if(c.cd>0){var pct=Math.round(c.cd/c.cdMax*100);cdEl.style.background='conic-gradient(rgba(0,0,0,.55) '+pct+'%, rgba(0,0,0,.15) 0)';tx.textContent=Math.ceil(c.cd)+'초';}
    else{cdEl.style.background='none';tx.textContent=c.id==='eden'&&c.star>0?'':'준비!';}
    if(c.id==='eden'&&c.star>0)tx.textContent='무적 '+Math.ceil(c.star)+'초';
  });
}

// ---------- Effects ----------
function puff(x,y,n,size,col){
  for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,s=rnd(.5,3.2)*size;
    parts.push({k:'cloud',x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(.6,1.2),max:1.2,r:rnd(.25,.6)*size,col:col||(Math.random()<.5?'#9be15d':'#c8f56b')});}
}
function sparks(x,y,n,col){for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,s=rnd(1,5);parts.push({k:'spark',x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(.4,.8),max:.8,r:rnd(.08,.16),col:col||'#ffe066'});}}
function ftext(x,y,txt,col,sz){parts.push({k:'text',x:x,y:y,vx:0,vy:-1.2,life:1.1,max:1.1,txt:txt,col:col||'#fff',sz:sz||.8});}
function ring(x,y,R,col){parts.push({k:'ring',x:x,y:y,R:R,life:.6,max:.6,col:col||'rgba(160,240,90,'});}

// ---------- Monster helpers ----------
function farTile(m,fx,fy,maxSteps){
  var tx=Math.floor(m.x),ty=Math.floor(m.y),d=bfs(tx,ty),bestT={x:tx,y:ty},bd=-1;
  for(var i=0;i<d.length;i++){if(d[i]<0||d[i]>maxSteps)continue;var x=i%GW,y=(i/GW)|0,dd=Math.hypot(x+.5-fx,y+.5-fy);if(dd>bd){bd=dd;bestT={x:x,y:y};}}
  return bestT;
}
function flyTo(m,t,dur,stun){m.fly={fx:m.x,fy:m.y,tx:t.x+.5,ty:t.y+.5,t:0,dur:dur};m.stun=stun;m.nx=null;}
function chooseNext(m){
  var cx=Math.floor(m.x),cy=Math.floor(m.y);
  var targets=chars.filter(function(c){return c.star<=0&&!c.tied;});
  var nb=[[1,0],[-1,0],[0,1],[0,-1]].map(function(o){return {x:cx+o[0],y:cy+o[1]};}).filter(function(t){return !isWall(t.x,t.y);});
  if(!nb.length){m.nx=cx;m.ny=cy;return;}
  var pick=null;
  if(targets.length){
    var bestD=1e9,bestDist=null;
    targets.forEach(function(c){var d=bfs(Math.floor(c.x),Math.floor(c.y));var v=d[cx+cy*GW];if(v>=0&&v<bestD){bestD=v;bestDist=d;}});
    if(bestDist){var bv=1e9;nb.forEach(function(t){var v=bestDist[t.x+t.y*GW];if(v<0)return;v+=Math.random()*.5;if(v<bv){bv=v;pick=t;}});}
  }
  if(!pick){var opts=nb.filter(function(t){return !(t.x===m.lx&&t.y===m.ly);});if(!opts.length)opts=nb;pick=opts[(Math.random()*opts.length)|0];}
  m.lx=cx;m.ly=cy;m.nx=pick.x;m.ny=pick.y;
}
function monsterSpeed(){return Math.min(2.3+0.035*roundTime,5.0);}

// ---------- Character movement ----------
function collide(e){
  var r=e.r,x0=Math.floor(e.x-r),x1=Math.floor(e.x+r),y0=Math.floor(e.y-r),y1=Math.floor(e.y+r);
  for(var cy=y0;cy<=y1;cy++)for(var cx=x0;cx<=x1;cx++){
    if(!isWall(cx,cy))continue;
    var px=clamp(e.x,cx,cx+1),py=clamp(e.y,cy,cy+1),dx=e.x-px,dy=e.y-py,d2=dx*dx+dy*dy;
    if(d2<r*r){var d=Math.sqrt(d2);if(d>1e-6){var k=(r-d)/d;e.x+=dx*k;e.y+=dy*k;}else{e.x=e.px;e.y=e.py;}}
  }
}
function moveCircle(e,dx,dy){
  var n=Math.max(1,Math.ceil(Math.hypot(dx,dy)/0.08));
  for(var i=0;i<n;i++){e.px=e.x;e.py=e.y;e.x+=dx/n;e.y+=dy/n;collide(e);collide(e);}
}
function cornerAssist(c,dx,dy,dt){
  // help slip into side corridors: nudge perpendicular axis toward the lane center
  var ax=Math.abs(dx),ay=Math.abs(dy);if(ax<.05&&ay<.05)return;
  var tx=Math.floor(c.x),ty=Math.floor(c.y),k=Math.min(1,dt*8);
  if(ax>ay){var sx=dx>0?1:-1;if(!isWall(tx+sx,ty))c.y+=(ty+.5-c.y)*k;}
  else{var sy=dy>0?1:-1;if(!isWall(tx,ty+sy))c.x+=(tx+.5-c.x)*k;}
}

// ---------- Powers ----------
function usePower(i){
  if(state!=='play')return;var c=chars[i];if(!c||c.cd>0||c.tied)return;c.cd=c.cdMax;
  if(c.id==='dad'){
    SFX.power();shake=.4;ring(c.x,c.y,4.5);puff(c.x,c.y,26,1.3);ftext(c.x,c.y-.8,'파워 방구! 뿌웅~','#d4ff7a',.9);
    monsters.forEach(function(m){if(dist(m,c)<4.8&&!m.fly){flyTo(m,farTile(m,c.x,c.y,5),.5,2.2);ftext(m.x,m.y-.6,'으악!','#fff',.7);}});
  }else{
    SFX.starPow();c.star=5;sparks(c.x,c.y,30,'#fff59d');ftext(c.x,c.y-.8,'무적 별! ⭐','#ffe066',.9);
  }
}

// ---------- Chance (방구 필살기) ----------
function startChance(c,m){
  state='chance';chance={c:c,m:m,t:1.6,max:1.6};releaseAll();SFX.alarm();shake=.3;
  $('chanceTxt').textContent=c.name+' 잡혔다! 빨리 눌러요!';show('chance',true);
}
function chanceHit(){
  if(state!=='chance'||!chance)return;var c=chance.c,m=chance.m;
  SFX.win();shake=.5;puff(c.x,c.y,40,1.6);ring(c.x,c.y,3.5);ftext(c.x,c.y-1,'뿌우웅~!','#d4ff7a',1.1);
  flyTo(m,farTile(m,c.x,c.y,99),.75,3);c.safe=1.6;bonus+=30;chance=null;hideChance();state='play';
  toast('날려버렸다! 💨',1000,'#b6ff5c');
}
function chanceMiss(){
  var c=chance.c,m=chance.m;chance=null;hideChance();lives--;SFX.lose();shake=.5;sparks(c.x,c.y,16,'#ff4d6d');
  flyTo(m,farTile(m,c.x,c.y,99),.6,2);c.safe=2.5;
  if(lives<=0){state='overwait';overT=1.0;toast('하트가 다 없어졌어요…',1200,'#ff9bb0');}
  else{state='play';toast('앗! 하트 -1',1000,'#ff9bb0');}
}
function gameOver(){
  state='over';releaseAll();SFX.over();var s=Math.floor(score),nb=s>best;
  if(nb){best=s;try{localStorage.setItem('fm_best',best);}catch(e){}}
  $('ovScore').textContent='점수 '+s+'점';$('ovTime').textContent='⏱ '+Math.floor(playTime)+'초 버텼어요 · ⭐ '+starCount+'개';
  $('ovBest').textContent=nb?'🎉 새 최고 기록!':'🏆 최고 점수: '+best;show('over',true);updateBest();
}

// ---------- Update ----------
function update(dt){
  var i,c,m;
  // particles always
  for(i=parts.length-1;i>=0;i--){var p=parts[i];p.life-=dt;p.x+=(p.vx||0)*dt;p.y+=(p.vy||0)*dt;if(p.vx){p.vx*=Math.pow(.15,dt);p.vy*=Math.pow(.15,dt);}if(p.life<=0)parts.splice(i,1);}
  shake=Math.max(0,shake-dt);
  if(state==='chance'){chance.t-=dt;$('chanceFill').style.width=Math.max(0,chance.t/chance.max*100)+'%';if(chance.t<=0)chanceMiss();return;}
  if(state==='tied'){tiedT-=dt;if(tiedT<=0)resetRound();return;}
  if(state==='overwait'){overT-=dt;if(overT<=0)gameOver();return;}
  if(state!=='play')return;
  playTime+=dt;roundTime+=dt;score=playTime*10+bonus;
  // characters
  for(i=0;i<chars.length;i++){c=chars[i];
    c.cd=Math.max(0,c.cd-dt);c.star=Math.max(0,c.star-dt);c.safe=Math.max(0,c.safe-dt);
    var maxSp=c.star>0?9:6.5,dvx=0,dvy=0;
    if(c.ptr){var tx=c.ptr.wx+c.ptr.ox,ty=c.ptr.wy+c.ptr.oy;dvx=(tx-c.x)*12;dvy=(ty-c.y)*12;}
    else{var kx=0,ky=0;
      if(c.id==='dad'){kx=(keys.KeyD?1:0)-(keys.KeyA?1:0);ky=(keys.KeyS?1:0)-(keys.KeyW?1:0);}
      else{kx=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0);ky=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0);}
      if(kx||ky){var kl=Math.hypot(kx,ky);dvx=kx/kl*maxSp;dvy=ky/kl*maxSp;}}
    var sp=Math.hypot(dvx,dvy);if(sp>maxSp){dvx*=maxSp/sp;dvy*=maxSp/sp;}
    var a=Math.min(1,dt*18);c.vx+=(dvx-c.vx)*a;c.vy+=(dvy-c.vy)*a;
    moveCircle(c,c.vx*dt,c.vy*dt);cornerAssist(c,c.vx,c.vy,dt);collide(c);
    if(Math.hypot(c.vx,c.vy)>.5)c.bob+=dt*14;
    if(c.star>0&&Math.random()<dt*20)sparks(c.x,c.y,1,'hsl('+((performance.now()/4)%360)+',100%,70%)');
    // stars
    for(var s=stars.length-1;s>=0;s--){if(dist(stars[s],c)<.6){var st=stars[s];stars.splice(s,1);bonus+=50;starCount++;SFX.star();sparks(st.x,st.y,14);ftext(st.x,st.y-.4,'+50','#ffe066',.7);spawnStar(c);}}
    // traps
    if(c.star<=0){for(var t=0;t<traps.length;t++){if(dist(traps[t],c)<.42){
      c.tied=true;c.x=traps[t].x;c.y=traps[t].y;traps[t].sprung=true;state='tied';tiedT=2.2;releaseAll();SFX.trap();shake=.3;
      toast(c.name+' 묶였어요! 🪢',2000,'#ffb86b');return;}}}
  }
  // second monster
  if(roundTime>=35&&monsters.length<2){var m2=makeMonster(1);m2.stun=1.2;monsters.push(m2);SFX.spawn();puff(m2.x,m2.y,24,1.2);toast('방구괴물이 하나 더! 😱',1500,'#d4ff7a');}
  var spd=monsterSpeed();
  for(i=0;i<monsters.length;i++){m=monsters[i];m.ph+=dt;
    if(m.fly){m.fly.t+=dt;var f=Math.min(1,m.fly.t/m.fly.dur),e=1-Math.pow(1-f,3);m.x=m.fly.fx+(m.fly.tx-m.fly.fx)*e;m.y=m.fly.fy+(m.fly.ty-m.fly.fy)*e;
      if(Math.random()<dt*30)puff(m.x,m.y,1,.6);if(f>=1){m.fly=null;m.nx=null;}continue;}
    if(m.stun>0){m.stun-=dt;}
    else{
      var step=spd*dt,guard=0;
      while(step>0&&guard++<6){
        if(m.nx===null){chooseNext(m);}
        var gx=m.nx+.5,gy=m.ny+.5,dx=gx-m.x,dy=gy-m.y,dd=Math.hypot(dx,dy);
        if(dd<=step){m.x=gx;m.y=gy;step-=dd;m.nx=null;if(dd<1e-6&&guard>1)break;}
        else{m.x+=dx/dd*step;m.y+=dy/dd*step;step=0;}
      }
      m.trail+=dt;if(m.trail>.12){m.trail=0;parts.push({k:'cloud',x:m.x+rnd(-.3,.3),y:m.y+rnd(-.2,.3),vx:0,vy:0,life:.7,max:.7,r:rnd(.12,.22),col:'#a6e36b'});}
    }
    // catch / bonk
    for(var j=0;j<chars.length;j++){c=chars[j];if(c.tied)continue;var d=dist(c,m);
      if(d<.72){
        if(c.star>0){if(m.stun<=0||!m.fly){SFX.bonk();bonus+=100;ftext(m.x,m.y-.6,'+100 뿅!','#ffe066',.8);puff(m.x,m.y,18,1);flyTo(m,farTile(m,c.x,c.y,99),.6,2.5);}break;}
        if(c.safe<=0&&m.stun<=0){startChance(c,m);return;}
      }}
  }
}

// ---------- Layout & rendering ----------
var dpr=1,VW=0,VH=0,tile=40,ox=0,oy=0,mazeCanvas=null;
function transposeWorld(){
  function sw(o){var t=o.x;o.x=o.y;o.y=t;}
  chars.forEach(function(c){sw(c);var t=c.vx;c.vx=c.vy;c.vy=t;if(c.ptr){t=c.ptr.ox;c.ptr.ox=c.ptr.oy;c.ptr.oy=t;}});
  monsters.forEach(function(m){sw(m);if(m.nx!==null){var t=m.nx;m.nx=m.ny;m.ny=t;}t=m.lx;m.lx=m.ly;m.ly=t;if(m.fly){t=m.fly.fx;m.fly.fx=m.fly.fy;m.fly.fy=t;t=m.fly.tx;m.fly.tx=m.fly.ty;m.fly.ty=t;}});
  traps.forEach(sw);stars.forEach(sw);parts.forEach(function(p){sw(p);var t=p.vx||0;p.vx=p.vy||0;p.vy=t;});
}
function layout(){
  VW=window.innerWidth;VH=window.innerHeight;dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.round(VW*dpr);canvas.height=Math.round(VH*dpr);
  var np=VH>VW*1.05;
  if(np!==portrait){portrait=np;buildGrid();transposeWorld();}
  var top=$('hud').getBoundingClientRect().bottom+2,bot=$('powers').getBoundingClientRect().top-2;
  var aw=VW-16,ah=Math.max(100,bot-top);
  tile=Math.max(8,Math.floor(Math.min(aw/GW,ah/GH)));
  ox=Math.round((VW-tile*GW)/2);oy=Math.round(top+(ah-tile*GH)/2);
  renderMaze();
}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function renderMaze(){
  mazeCanvas=document.createElement('canvas');var T=tile*dpr;mazeCanvas.width=Math.ceil(GW*T);mazeCanvas.height=Math.ceil(GH*T);
  var g=mazeCanvas.getContext('2d'),x,y;
  // floor
  rr(g,0,0,GW*T,GH*T,T*.4);g.fillStyle='#fff3d1';g.fill();
  for(y=0;y<GH;y++)for(x=0;x<GW;x++)if(!grid[y][x]&&(x+y)%2){g.fillStyle='#ffe9b8';g.fillRect(x*T,y*T,T,T);}
  // wall shadow, wall body, wall top highlight
  var layers=[[0,'#3d2f9e',T*.07],[0,'#7b6cf0',0],[T*.2,'#a99cff',-T*.03]];
  layers.forEach(function(L){
    var ins=L[0],off=L[2];g.fillStyle=L[1];
    for(y=0;y<GH;y++)for(x=0;x<GW;x++){if(!grid[y][x])continue;
      rr(g,x*T+ins,y*T+ins+off,T-ins*2,T-ins*2,(T-ins*2)*.3);g.fill();
      if(x+1<GW&&grid[y][x+1])g.fillRect(x*T+T/2,y*T+ins+off,T,T-ins*2);
      if(y+1<GH&&grid[y+1][x])g.fillRect(x*T+ins,y*T+T/2+off,T-ins*2,T);
    }
  });
}
function W2S(x,y){return [ox+x*tile,oy+y*tile];}
function drawStarShape(g,cx,cy,R,r){g.beginPath();for(var i=0;i<10;i++){var a=-Math.PI/2+i*Math.PI/5,rad=i%2?r:R;g.lineTo(cx+Math.cos(a)*rad,cy+Math.sin(a)*rad);}g.closePath();}
function drawImg(img,cx,cy,maxW,maxH,rot,alpha){
  if(!img.complete||!img.naturalWidth)return;var s=Math.min(maxW/img.naturalWidth,maxH/img.naturalHeight),w=img.naturalWidth*s,h=img.naturalHeight*s;
  ctx.save();ctx.translate(cx,cy);if(rot)ctx.rotate(rot);ctx.globalAlpha=alpha==null?1:alpha;ctx.drawImage(img,-w/2,-h/2,w,h);ctx.restore();
}
var now=0;
function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#2b2350';ctx.fillRect(0,0,VW,VH);
  var sx=0,sy=0;if(shake>0){sx=rnd(-1,1)*shake*14;sy=rnd(-1,1)*shake*14;}
  ctx.save();ctx.translate(sx,sy);
  if(mazeCanvas)ctx.drawImage(mazeCanvas,ox,oy,GW*tile,GH*tile);
  var T=tile,t=now/1000,i,p;
  // traps (sneaky: faint & shimmering)
  traps.forEach(function(q){var s=W2S(q.x,q.y),a=.5+.25*Math.sin(t*2+q.ph);ctx.save();ctx.globalAlpha=q.sprung?1:a;ctx.translate(s[0],s[1]);
    if(q.type==='gum'){ctx.fillStyle='#ff8fc7';ctx.strokeStyle='#d94f97';ctx.lineWidth=T*.05;ctx.beginPath();
      for(var k=0;k<8;k++){var an=k/8*Math.PI*2,rr2=T*(.3+.06*Math.sin(k*2.3+q.ph));ctx.lineTo(Math.cos(an)*rr2,Math.sin(an)*rr2*.75);}
      ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='rgba(255,255,255,.6)';ctx.beginPath();ctx.arc(-T*.1,-T*.06,T*.06,0,7);ctx.fill();
      var b=(t*.7+q.ph)%1;ctx.strokeStyle='rgba(255,170,210,'+(1-b)+')';ctx.lineWidth=T*.03;ctx.beginPath();ctx.arc(T*.08,-T*.05,T*(.05+.12*b),0,7);ctx.stroke();}
    else{ctx.strokeStyle='#a0672b';ctx.lineWidth=T*.07;ctx.setLineDash([T*.09,T*.05]);ctx.beginPath();ctx.ellipse(0,0,T*.32,T*.24,0,0,7);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle='#7a4a1a';ctx.beginPath();ctx.arc(T*.3,0,T*.08,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(T*.32,0);ctx.quadraticCurveTo(T*.45,T*.15,T*.4,T*.3);ctx.stroke();}
    ctx.restore();});
  // stars
  stars.forEach(function(q){var s=W2S(q.x,q.y+Math.sin(t*3+q.ph)*.06);ctx.save();ctx.translate(s[0],s[1]);ctx.rotate(Math.sin(t*2+q.ph)*.3);
    ctx.fillStyle='#ffd400';ctx.strokeStyle='#e08a00';ctx.lineWidth=T*.05;drawStarShape(ctx,0,0,T*.3,T*.13);ctx.fill();ctx.stroke();ctx.restore();});
  // trail clouds below
  parts.forEach(function(p){if(p.k!=='cloud')return;var s=W2S(p.x,p.y),f=p.life/p.max;ctx.globalAlpha=Math.max(0,f*.8);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(s[0],s[1],p.r*T*(1.6-f*.6),0,7);ctx.fill();});
  ctx.globalAlpha=1;
  // characters
  chars.forEach(function(c){var s=W2S(c.x,c.y),bob=Math.sin(c.bob)*T*.04;
    ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.ellipse(s[0],s[1]+T*.36,T*.36,T*.12,0,0,7);ctx.fill();
    if(c.star>0){ctx.save();ctx.globalAlpha=.55+.25*Math.sin(t*12);ctx.fillStyle='hsl('+((t*360)%360)+',100%,65%)';ctx.beginPath();ctx.arc(s[0],s[1],T*.62,0,7);ctx.fill();ctx.restore();}
    if(c.ptr){ctx.strokeStyle=c.color;ctx.lineWidth=T*.08;ctx.beginPath();ctx.arc(s[0],s[1],T*.58,0,7);ctx.stroke();}
    var al=c.safe>0?(Math.sin(t*30)>0?1:.35):1;
    drawImg(imgs[c.id],s[0],s[1]+bob,T*1.15,T*1.15,Math.sin(c.bob*.5)*.06,al);
    if(c.tied){ctx.save();ctx.strokeStyle='#a0672b';ctx.lineWidth=T*.09;ctx.lineCap='round';var w=Math.sin(t*20)*T*.03;
      for(var k=-1;k<=1;k++){ctx.beginPath();ctx.moveTo(s[0]-T*.55,s[1]+k*T*.22+w);ctx.quadraticCurveTo(s[0],s[1]+k*T*.22+T*.1,s[0]+T*.55,s[1]+k*T*.22-w);ctx.stroke();}ctx.restore();}
    // name tag
    ctx.font='800 '+Math.max(10,T*.28)+'px -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    var tw=ctx.measureText(c.name).width+T*.25;ctx.fillStyle=c.color;rr(ctx,s[0]-tw/2,s[1]+T*.48,tw,T*.34,T*.17);ctx.fill();ctx.fillStyle=c.id==='eden'?'#4a2c00':'#fff';ctx.fillText(c.name,s[0],s[1]+T*.66);
  });
  // monsters
  monsters.forEach(function(m){var s=W2S(m.x,m.y),wob=1+Math.sin(m.ph*6)*.05,rot=m.fly?m.fly.t*14:Math.sin(m.ph*3)*.08;
    drawImg(imgs.monster,s[0],s[1],T*1.55*wob,T*1.25/wob,rot,m.stun>0&&!m.fly?.75:1);
    if(m.stun>0&&!m.fly){for(var k=0;k<3;k++){var an=t*5+k*2.1;ctx.fillStyle='#ffe066';drawStarShape(ctx,s[0]+Math.cos(an)*T*.45,s[1]-T*.55+Math.sin(an)*T*.12,T*.13,T*.06);ctx.fill();}}
  });
  // fx on top
  parts.forEach(function(p){var s=W2S(p.x,p.y),f=p.life/p.max;
    if(p.k==='spark'){ctx.globalAlpha=f;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(s[0],s[1],p.r*T,0,7);ctx.fill();}
    else if(p.k==='ring'){ctx.globalAlpha=f;ctx.strokeStyle=p.col+f+')';ctx.lineWidth=T*.25*f;ctx.beginPath();ctx.arc(s[0],s[1],p.R*T*(1-f*.85),0,7);ctx.stroke();}
    else if(p.k==='text'){ctx.globalAlpha=Math.min(1,f*2);ctx.font='900 '+(p.sz*T)+'px -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';ctx.textAlign='center';ctx.lineWidth=T*.12;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.strokeText(p.txt,s[0],s[1]);ctx.fillStyle=p.col;ctx.fillText(p.txt,s[0],s[1]);}
  });
  ctx.globalAlpha=1;ctx.restore();
}

// ---------- Input ----------
function toWorld(cx,cy){return {x:(cx-ox)/tile,y:(cy-oy)/tile};}
canvas.addEventListener('pointerdown',function(e){
  e.preventDefault();initAudio();if(state!=='play')return;
  var w=toWorld(e.clientX,e.clientY),bestC=null,bd=1e9;
  chars.forEach(function(c){if(c.ptr||c.tied)return;var d=Math.hypot(c.x-w.x,c.y-w.y);if(d<bd){bd=d;bestC=c;}});
  if(bestC&&bd<4){var ox2=bestC.x-w.x,oy2=bestC.y-w.y,l=Math.hypot(ox2,oy2);if(l>.6){ox2*=.6/l;oy2*=.6/l;}
    bestC.ptr={id:e.pointerId,wx:w.x,wy:w.y,ox:ox2,oy:oy2};try{canvas.setPointerCapture(e.pointerId);}catch(er){}}
},{passive:false});
canvas.addEventListener('pointermove',function(e){var w=null;chars.forEach(function(c){if(c.ptr&&c.ptr.id===e.pointerId){w=w||toWorld(e.clientX,e.clientY);c.ptr.wx=w.x;c.ptr.wy=w.y;}});});
function up(e){chars.forEach(function(c){if(c.ptr&&c.ptr.id===e.pointerId)c.ptr=null;});}
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);canvas.addEventListener('lostpointercapture',up);
['touchstart','touchmove','touchend'].forEach(function(ev){document.addEventListener(ev,function(e){if(e.touches&&e.touches.length>1||ev==='touchmove')e.preventDefault();},{passive:false});});
['gesturestart','gesturechange','gestureend','dblclick','contextmenu'].forEach(function(ev){document.addEventListener(ev,function(e){e.preventDefault();},{passive:false});});
var lastTouchEnd=0;document.addEventListener('touchend',function(e){var n=Date.now();if(n-lastTouchEnd<350)e.preventDefault();lastTouchEnd=n;},{passive:false});
window.addEventListener('keydown',function(e){keys[e.code]=true;initAudio();
  if(e.code==='KeyE'||e.code==='KeyQ')usePower(0);if(e.code==='Enter'||e.code==='ShiftRight'||e.code==='Slash')usePower(1);
  if(e.code==='Space'){if(state==='chance')chanceHit();else if(state==='start'||state==='over')newGame();}
  if(e.code==='Escape'||e.code==='KeyP'){if(state==='play')pause();else if(state==='paused')resume();}
  if(e.code.indexOf('Arrow')===0||e.code==='Space')e.preventDefault();});
window.addEventListener('keyup',function(e){keys[e.code]=false;});
window.addEventListener('blur',function(){keys={};});
window.addEventListener('resize',layout);window.addEventListener('orientationchange',function(){setTimeout(layout,250);});

// ---------- Loop ----------
var last=performance.now();
function frame(ts){
  now=ts;var dt=Math.min(.05,Math.max(0,(ts-last)/1000));last=ts;
  update(dt);render();updateHud();requestAnimationFrame(frame);
}
buildGrid();
// demo scene behind the start screen
chars=[makeChar('dad'),makeChar('eden')];monsters=[makeMonster(0)];placeTraps();for(var si=0;si<6;si++)spawnStar();
layout();requestAnimationFrame(frame);
window.__game={get state(){return state;},get chars(){return chars;},get monsters(){return monsters;},get traps(){return traps;},get lives(){return lives;},get score(){return score;},startChance:function(i){startChance(chars[i],monsters[0]);},chanceHit:chanceHit,usePower:usePower,screenOf:function(){return chars.map(function(c){return W2S(c.x,c.y);});}};
})();
</script>
